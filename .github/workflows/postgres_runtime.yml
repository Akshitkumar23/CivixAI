name: PostgreSQL Runtime & Migration CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  postgres-parity-validation:
    name: PostgreSQL 16 Parity & Migration Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary sqlalchemy pytest pgvector
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize pgvector Extension
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civix_test
        run: |
          python -c "from sqlalchemy import create_engine, text; engine = create_engine('${{ env.DATABASE_URL }}'); engine.connect().execute(text('CREATE EXTENSION IF NOT EXISTS vector;')); print('✔ pgvector extension enabled');"

      - name: Run PostgreSQL CI Harness
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civix_test
        run: |
          python scripts/test_postgres_ci.py

      - name: Run PostgreSQL Driver & Runtime Test Suite
        env:
          CIVIX_POSTGRES_TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/civix_test
        run: |
          pytest tests/test_postgres_runtime.py tests/test_infrastructure_and_storage.py -v
