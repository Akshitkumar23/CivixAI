version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - ML_API_URL=http://ml-api:8000
      - NEXT_PUBLIC_ML_API_URL=http://localhost:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - ml-api

  ml-api:
    build:
      context: .
      dockerfile: services/ml_api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./services:/app/services
    environment:
      - PORT=8000
